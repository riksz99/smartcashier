// ---- printer picker: USB / Serial(COM, Bluetooth SPP) / Bluetooth LE / system dialog / print file
const sleep2=ms=>new Promise(r=>setTimeout(r,ms));
const apiOk=(a,f)=>{try{if(!(a in navigator))return false;const p=document.permissionsPolicy||document.featurePolicy;return p&&p.allowsFeature?p.allowsFeature(f):true}catch(e){return true}};
let prT=null;
async function trSerial(baud){let p=(await navigator.serial.getPorts())[0];if(!p)p=await navigator.serial.requestPort();if(!p.writable)await p.open({baudRate:baud||9600});const w=p.writable.getWriter();return{name:'Serial/COM',send:async b=>{await w.write(b)},close:()=>{try{w.releaseLock()}catch(e){}}}}
async function trUsb(){const d=(await navigator.usb.getDevices())[0]||await navigator.usb.requestDevice({filters:[]});await d.open();if(!d.configuration)await d.selectConfiguration(1);let ep=null,ifn=null;for(const i of d.configuration.interfaces)for(const a of i.alternates){const e=a.endpoints.find(x=>x.direction=='out'&&x.type=='bulk');if(e&&(a.interfaceClass==7||ep==null)){ep=e.endpointNumber;ifn=i.interfaceNumber}}
if(ep==null)throw new Error(lang=='id'?'Endpoint USB tidak ditemukan':'USB endpoint not found');try{await d.claimInterface(ifn)}catch(e){throw new Error(lang=='id'?'USB dipakai driver Windows. Pakai opsi Serial/COM atau Printer sistem.':'USB is held by the OS driver. Use Serial/COM or System printer.')}
return{name:d.productName||'USB',send:async b=>{for(let i=0;i<b.length;i+=4096)await d.transferOut(ep,b.slice(i,i+4096))},close:()=>{try{d.close()}catch(e){}}}}
async function trBle(){await prConnect();return{name:prDev.name||'Bluetooth LE',send:btSend,close:()=>{}}}
const printFile=(html,w)=>{const mm=w=='58mm'?54:w=='80mm'?76:0,pg=mm?`size:${mm+4}mm auto;margin:2mm`:`size:${w=='A5'?'A5':'A4'};margin:10mm`;return `<!doctype html><meta charset="utf-8"><title>Cetak</title><style>@page{${pg}}body{margin:0;font:12px/1.4 "Courier New",monospace;color:#000;${mm?'width:'+mm+'mm':''}}table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top}hr{border:0;border-top:1px dashed #000}</style>${html}<script>onload=()=>setTimeout(()=>print(),300)<\/script>`};
function printPicker(data,html,w){const id=lang=='id',B=(i,a,l)=>`<button id="${i}" ${a?'':'disabled'} style="width:100%;margin:4px 0;text-align:left">${l}${a?'':(id?' — tidak tersedia di tampilan ini':' — unavailable in this view')}</button>`;
modal(`<h3>${id?'Pilih printer':'Choose printer'}</h3><small style="color:var(--mu)">${id?'Pilih cara menyambung ke printer di laptop/PC. Setelah tersambung, cetak berikutnya langsung terkirim.':'Choose how to connect to the printer on this PC. Once connected, later prints are sent directly.'}</small>${B('pp_usb',apiOk('usb','usb'),'USB')}${B('pp_ser',apiOk('serial','serial'),'Serial / COM (USB-serial, Bluetooth SPP)')}${B('pp_ble',apiOk('bluetooth','bluetooth'),'Bluetooth LE')}<label>Baud (Serial)</label><select id="pp_baud">${[9600,19200,38400,57600,115200].map(k=>`<option>${k}</option>`).join('')}</select><hr>${B('pp_sys',true,id?'Printer sistem (dialog cetak browser)':'System printer (browser dialog)')}${B('pp_file',true,id?'Unduh file cetak (.html), buka lalu cetak':'Download print file (.html), open and print')}<div id="pp_err" class="bad" style="margin-top:8px"></div><div class="row"><button id="pp_x">${t('close')}</button></div>`);
const run=async f=>{try{$('#pp_err').textContent='';prT=await f();await prT.send(data);closeM();toast(t('printed')+' · '+prT.name)}catch(e){if(prT&&prT.close)prT.close();prT=null;if(e&&(e.name=='NotFoundError'||e.name=='AbortError'))return;const el=$('#pp_err');if(el)el.textContent=(e&&e.message)||String(e)}};
$('#pp_usb').onclick=()=>run(trUsb);$('#pp_ser').onclick=()=>run(()=>trSerial(+$('#pp_baud').value));$('#pp_ble').onclick=()=>run(trBle);
$('#pp_sys').onclick=async()=>{closeM();await sleep2(150);await printDoc(html,w)};$('#pp_file').onclick=()=>{closeM();save_file('cetak-'+Date.now()+'.html',printFile(html,w))};$('#pp_x').onclick=closeM}
async function smartPrint(rows,html,w){if(/Android/i.test(navigator.userAgent))return smartPrintOld(rows,html,w);const data=escBytes(rows,w);if(prT){try{await prT.send(data);return toast(t('printed')+' · '+prT.name)}catch(e){if(prT.close)prT.close();prT=null}}await autoPrint(data,html,w)}
async function autoPrint(data,html,w){const id=lang=='id',tr=[['usb',trUsb],['serial',()=>trSerial(9600)],['bluetooth',trBle]].find(([a])=>apiOk(a,a));
if(tr){try{prT=await tr[1]();await prT.send(data);return toast(t('printed')+' · '+prT.name)}catch(e){if(prT&&prT.close)prT.close();prT=null;if(!(e&&(e.name=='NotFoundError'||e.name=='AbortError')))toast((id?'Tidak bisa langsung ke printer: ':'Direct print failed: ')+((e&&e.message)||e))}}
await sleep2(300);if(!await printDoc(html,w))save_file('cetak-'+Date.now()+'.html',printFile(html,w))}
$('#main').addEventListener('change',e=>{const d=e.target.dataset;if(page!='prods')return;if(d.psel!==undefined){e.target.checked?selP.add(d.psel):selP.delete(d.psel);return render()}if(e.target.id=='pall'){document.querySelectorAll('[data-psel]').forEach(c=>e.target.checked?selP.add(c.dataset.psel):selP.delete(c.dataset.psel));render()}});
$('#main').addEventListener('click',async e=>{if(e.target.id!='pdm'||page!='prods')return;if(!await ask(t('sure'))||!await guard(1))return;const ok=[],skip=[];[...selP].forEach(i=>{const p=P(i);if(!p)return;(S.sales.some(s=>s.items.some(x=>x.pid==p.id))?skip:ok).push(p)});for(const p of ok)for(const k of p.imgs||[])await idb('img','delete',k);S.prods=S.prods.filter(x=>!ok.includes(x));selP.clear();await save();render();const id=lang=='id';toast(ok.length+(id?' produk dihapus':' products deleted')+(skip.length?(id?`, ${skip.length} dilewati (ada riwayat penjualan)`:`, ${skip.length} skipped (has sales history)`):''))});
// ---- bulk select & delete (dashboard 'd', history 'h', stock moves 'm')
const bsel={h:new Set(),d:new Set(),m:new Set()};
const bchk=(k,id)=>`<input type="checkbox" data-bs="${k}:${id}" ${bsel[k].has(String(id))?'checked':''}>`;
const ball=(k,ids)=>`<input type="checkbox" data-ba="${k}" title="${lang=='id'?'Pilih semua':'Select all'}" ${ids.length&&ids.every(i=>bsel[k].has(String(i)))?'checked':''}>`;
const bbtn=k=>bsel[k].size?`<button class="d" data-bdel="${k}">${t('del')} (${bsel[k].size})</button>`:'';
function dashTx(m){const r=m.ss.slice().sort((a,b)=>b.date-a.date).slice(0,10);return `<div class="card tw" style="margin-top:12px"><div class="row"><b class="sp">${t('txs')}</b>${bbtn('d')}</div><table><tr><th>${ball('d',r.map(s=>s.id))}</th><th>${t('no')}</th><th>${t('date')}</th><th>${t('status')}</th><th class="n">${t('total')}</th></tr>${r.map(s=>`<tr><td>${bchk('d',s.id)}</td><td>${s.no}</td><td>${dt(s.date)}</td><td>${t(s.status)}</td><td class="n">${R(s.total)}</td></tr>`).join('')||`<tr><td colspan="5">${t('empty')}</td></tr>`}</table></div>`}
$('#main').addEventListener('change',e=>{const d=e.target.dataset;if(d.bs){bsel[d.bs[0]][e.target.checked?'add':'delete'](d.bs.slice(2));return render()}if(d.ba){const k=d.ba,ids=k=='h'?filt().map(s=>s.id):k=='m'?S.moves.map(m=>m.id):[...document.querySelectorAll('[data-bs^="d:"]')].map(c=>c.dataset.bs.slice(2));ids.forEach(i=>bsel[k][e.target.checked?'add':'delete'](String(i)));render()}});
$('#main').addEventListener('click',async e=>{const k=e.target.dataset.bdel;if(!k)return;if(!await ask(t('sure'))||!await guard(1))return;await snap('pre-delete');const id=lang=='id';let n=0,sk=0;
if(k=='m'){for(const i of [...bsel.m]){const m=S.moves.find(x=>String(x.id)==i);if(!m)continue;const p=P(m.pid);if((m.type=='adjust'||m.type=='initial')&&p){if(p.stock-m.qty<0){sk++;continue}p.stock-=m.qty}S.moves=S.moves.filter(x=>x!==m);n++}audit('bulk delete moves',n)}
else{const set=bsel[k],del=S.sales.filter(s=>set.has(String(s.id)));n=del.length;S.sales=S.sales.filter(s=>!set.has(String(s.id)));audit('bulk delete sales',n);bsel.h.clear();bsel.d.clear()}
bsel[k].clear();await save();render();toast(n+(id?' data dihapus':' deleted')+(sk?(id?`, ${sk} dilewati (stok akan minus)`:`, ${sk} skipped (stock would go negative)`):''))});
// ---- automatic backup: daily snapshot + before bulk delete (last 7 kept on this device)
const skey=d=>'snap:'+d;
async function snapList(){try{return (await idb('kv','get','snaps'))||[]}catch(e){return []}}
async function snap(tag){try{const day=tag||new Date().toLocaleDateString('sv');let l=await snapList();await idb('kv','put',JSON.parse(JSON.stringify(S)),skey(day));l=[day,...l.filter(x=>x!=day)];for(const x of l.slice(7))await idb('kv','delete',skey(x));await idb('kv','put',l.slice(0,7),'snaps')}catch(e){}}
async function autoBk(){try{if(!S)return;const day=new Date().toLocaleDateString('sv');if(!(await snapList()).includes(day))await snap();let lb=0;try{lb=+localStorage.getItem('lastbk')||0}catch(e){}if(!lb){try{localStorage.setItem('lastbk',Date.now())}catch(e){}}else if(Date.now()-lb>7*864e5)toast(lang=='id'?'Sudah lebih dari 7 hari belum unduh cadangan. Buka Pengaturan lalu klik Cadangkan.':'No backup file downloaded for over 7 days. Open Settings and click Backup.')}catch(e){}}
async function snapUI(){const b=$('#snapbox');if(!b)return;const l=await snapList(),id=lang=='id',lab=x=>x=='pre-delete'?(id?'Sebelum hapus massal terakhir':'Before last bulk delete'):x=='pre-restore'?(id?'Sebelum pemulihan terakhir':'Before last restore'):x;b.innerHTML=l.length?`<label>${id?'Cadangan otomatis (tersimpan di perangkat ini)':'Automatic backups (stored on this device)'}</label><div class="row"><select id="snsel">${l.map(x=>`<option value="${x}">${lab(x)}</option>`).join('')}</select><button id="snrs">${id?'Pulihkan':'Restore'}</button></div>`:`<small>${id?'Cadangan otomatis dibuat setiap hari.':'Automatic backups are created daily.'}</small>`}
$('#main').addEventListener('click',async e=>{if(e.target.id!='snrs')return;if(!await ask(t('sure'))||!await guard(1))return;const d=await idb('kv','get',skey($('#snsel').value));if(!d)return toast(t('fail'));await snap('pre-restore');S=d;migrate();await save();render();toast(t('ok'))});
init();setTimeout(autoBk,2500);
